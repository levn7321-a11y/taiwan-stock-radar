name: K線缺漏行情容錯測試
on:
  push:
    branches: [fix/skip-incomplete-ohlc-bars]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt 'altair>=5,<7'
      - run: python -m compileall -q technical_charts.py price_periods.py pages
      - run: python -m unittest discover -s tests -p 'test_missing_ohlc.py' -v
