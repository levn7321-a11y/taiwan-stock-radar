
name: V2.6 每日行情與法人歷史回補

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill_v26.yml'
      - 'backfill_ma240.py'
      - 'runtime_db.py'
  workflow_dispatch:
    inputs:
      days:
        description: "本次回補日曆天數"
        required: true
        default: "90"
      reset:
        description: "是否重新從最新日期開始"
        required: true
        type: boolean
        default: false

  schedule:
    # 台灣時間每日 21:30
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v26-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: 下載 GitHub 專案
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 還原完整歷史資料庫
        run: |
          python -c "from runtime_db import ensure_db; ensure_db(force=True)"

      - name: 官方歷史行情補足至 260 個交易日
        env:
          DAYS: ${{ github.event.inputs.days || '90' }}
          RESET: ${{ github.event.inputs.reset || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$RESET" = "true" ]; then
            python backfill_v26.py --days "$DAYS" --reset
          fi
          # 正式版首次更新時連續補三批，其餘每天只補一批，避免逾時。
          if [ "$EVENT_NAME" = "push" ]; then
            python backfill_ma240.py --target 260 --batches 3 --days 90
          else
            python backfill_ma240.py --target 260 --batches 1 --days "$DAYS"
          fi

      - name: 完整壓縮保存歷史資料庫
        run: |
          python - <<'PY'
          import gzip
          import os
          import sqlite3
          import shutil
          from pathlib import Path
          from runtime_db import DB, ARCHIVE
          # Compact the SQLite DB first, then gzip all tables including institutions.
          with sqlite3.connect(DB) as conn:
              conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              conn.execute("VACUUM")
              count = conn.execute("SELECT market, COUNT(DISTINCT date) FROM daily WHERE close > 0 GROUP BY market").fetchall()
              print("交易日總數:", count, flush=True)
          pending = ARCHIVE.with_suffix(".gz.tmp")
          with DB.open("rb") as src, gzip.open(pending, "wb", compresslevel=6) as dst:
              shutil.copyfileobj(src, dst, length=1024*1024)
          size = pending.stat().st_size
          print(f"完整壓縮檔大小：{size/1024/1024:.1f} MB", flush=True)
          if size >= 95*1024*1024:
              pending.unlink()
              raise SystemExit("資料庫壓縮後仍超過 GitHub 95MB 安全上限，未覆寫任何資料")
          os.replace(pending, ARCHIVE)
          PY

      - name: 提交完整壓縮資料庫至 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Leave the original tracked database untouched, publish only gzip archive.
          git restore --source=HEAD -- twstock.sqlite3
          git add twstock_full.sqlite3.gz
          git diff --cached --quiet && exit 0
          git commit -m "Update complete gzip-compressed price and institutional history"
          git pull --rebase origin main
          git push origin HEAD:main
