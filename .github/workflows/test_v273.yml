name: V2.7.3 白底與自選搜尋測試
on:
  push:
    branches: [fix/v273-light-watch-search]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app.py pages top_nav.py search_popularity.py
      - run: python -m unittest discover -s tests -p 'test_v273.py' -v
