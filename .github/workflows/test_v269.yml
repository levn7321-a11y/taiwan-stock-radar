name: V2.6.9 功能測試
on:
  push:
    branches:
      - feature/top-navigation-inst-score-v269
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝依賴
        run: pip install pandas numpy
      - name: 編譯所有 Python 程式
        run: python -m compileall -q app.py pages top_nav.py
      - name: 執行法人排行及高分股票測試
        run: python -m unittest discover -s tests -p 'test_v269.py' -v
