name: 測試完整歷史資料庫壓縮與還原
on:
  push:
    branches: [fix/compressed-history-db-publishing]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q runtime_db.py top_nav.py backfill_ma240.py
      - run: python -m unittest discover -s tests -p 'test_compressed_db.py' -v
