name: V2.7.5 自選看盤與三大指數測試
on:
  push:
    branches: [feature/v275-watch-index-search-trust]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝測試相依
        run: pip install 'streamlit>=1.36,<2' 'pandas>=2.1,<3' 'altair>=5,<7' requests
      - name: 檢查 Python 語法
        run: python -m compileall -q app.py pages top_nav.py technical_charts.py market_indices.py
      - name: 執行 V2.7.5 測試
        run: python -m unittest discover -s tests -p 'test_v275.py' -v
