name: A網站異常監控（瀏覽器與Oh no畫面）
on:
  schedule:
    # 每30分鐘檢查一次；GitHub排程可能延遲
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site_monitor.yml'
      - 'monitor_site.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: stock-radar-uptime-monitor
  cancel-in-progress: false

jobs:
  browser-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝監控所需瀏覽器
        run: |
          pip install requests 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium
      - name: 真實開啟A網站並偵測Oh no錯誤
        id: probe
        continue-on-error: true
        run: |
          python monitor_site.py --url "https://taiwan-stock-radar-7321.streamlit.app/" --attempts 2
      - name: 留存監控報告與異常截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-uptime-${{ github.run_id }}
          path: |
            site-monitor-result.json
            site-monitor-failure.png
          if-no-files-found: warn
          retention-days: 30
      - name: 異常時建立或更新GitHub Issue
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='[網站監控] A網站無法正常開啟'
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          MESSAGE="網站連續兩次檢查失敗（含實際瀏覽器畫面）。時間：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')；[執行紀錄](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})。請下載 workflow artifact 查看 JSON 與可能的截圖。"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$MESSAGE"
          else
            gh issue comment "$EXISTING" --body "$MESSAGE"
          fi
          exit 1
      - name: 網站恢復時關閉既有監控Issue
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='[網站監控] A網站無法正常開啟'
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "已於 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z') 通過完整瀏覽器、HTTP與health檢查。[恢復紀錄](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
