
name: V2.6 每日行情與法人歷史回補

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill_v26.yml'
      - 'backfill_ma240.py'
  workflow_dispatch:
    inputs:
      days:
        description: "本次回補日曆天數"
        required: true
        default: "90"
      reset:
        description: "是否重新從最新日期開始"
        required: true
        type: boolean
        default: false

  schedule:
    # 台灣時間每日 21:30
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v26-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: 下載 GitHub 專案
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 官方歷史行情補足至 260 個交易日
        env:
          DAYS: ${{ github.event.inputs.days || '90' }}
          RESET: ${{ github.event.inputs.reset || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$RESET" = "true" ]; then
            python backfill_v26.py --days "$DAYS" --reset
          fi
          # 正式版首次更新時連續補三批，其餘每天只補一批，避免逾時。
          if [ "$EVENT_NAME" = "push" ]; then
            python backfill_ma240.py --target 260 --batches 3 --days 90
          else
            python backfill_ma240.py --target 260 --batches 1 --days "$DAYS"
          fi

      - name: 儲存資料庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add twstock.sqlite3
          git diff --cached --quiet && exit 0

          git commit -m "Update V2.6 price and institutional history"
          git push
