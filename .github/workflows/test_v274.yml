name: V2.7.4 K線標記與歷史回補驗證
on:
  push:
    branches: [fix/v274-chart-ma240-stocklinks]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app.py pages technical_charts.py backfill_v26.py
      - run: python -m unittest discover -s tests -p 'test_v274.py' -v
