name: V2.6.9 自選個股測試
on:
  pull_request:
    paths:
      - "pages/3_自選個股.py"
      - "tests/test_watchlist_v269.py"
      - ".github/workflows/test_watchlist_v269.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watchlist-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝測試依賴
        run: python -m pip install "pandas>=2.1,<3"
      - name: Python 語法檢查
        run: python -m py_compile "pages/3_自選個股.py" tests/test_watchlist_v269.py
      - name: 執行自選個股回歸測試
        run: python -m unittest discover -s tests -p "test_watchlist_v269.py" -v
