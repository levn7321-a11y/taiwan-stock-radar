
name: V2.6.4 資料庫健康檢查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 執行資料庫健康檢查
        run: |
          python check_v264.py

      - name: 檢查完成
        run: echo "V2.6.4 資料庫健康檢查完成"
